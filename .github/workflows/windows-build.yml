name: Build private TGONE on Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgone-private-windows-build
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      CI: 'true'
      TGONE_SOURCE_REVISION: hotfix141-source-verified
    steps:
      - name: Checkout private TGONE source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: beeixxd/TGONE
          ref: build/tgone-1.3.12-635a8f1
          token: ${{ secrets.TGONE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - name: Fixed Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Fixed Python (build host)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
          architecture: x64
      - name: Install locked test and build dependencies
        working-directory: source
        shell: pwsh
        run: ./ci/windows-build.ps1 -Mode Dependencies
      - name: Compilation journal regression
        working-directory: source
        shell: pwsh
        run: ./ci/test-build-records142.ps1 -SourceScript ./ci/windows-build.ps1 -FixtureRoot "$env:RUNNER_TEMP/TGONE-recorder142"
      - name: Full desktop and Python regression
        id: tests
        continue-on-error: true
        working-directory: source
        shell: pwsh
        run: ./ci/windows-build.ps1 -Mode Test
      - name: Compile unaccepted Windows test installer
        id: compile
        working-directory: source
        shell: pwsh
        run: ./ci/windows-build.ps1 -Mode Compile
      - name: Native silent install and uninstall on fresh runner
        id: install
        continue-on-error: true
        working-directory: source
        shell: pwsh
        run: ./ci/install-smoke.ps1
      - name: Attach installation evidence to test package
        if: always() && steps.compile.outcome == 'success'
        working-directory: source
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath ci-results/install-smoke.json) {
            Copy-Item -LiteralPath ci-results/install-smoke.json -Destination ci-artifacts/
          }
      - name: Upload Windows installer and build evidence
        if: always() && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TGONE-Windows-${{ github.run_number }}-${{ github.sha }}
          path: |
            source/ci-artifacts/*.exe
            source/ci-artifacts/COMPILATION.json
            source/ci-artifacts/TEST-BUILD.json
            source/ci-artifacts/INSTALLER-SELECTION415.json
            source/ci-artifacts/install-smoke.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TGONE-diagnostics-${{ github.run_number }}-${{ github.sha }}
          path: source/ci-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve regression failure as workflow failure
        if: always() && (steps.tests.outcome == 'failure' || steps.install.outcome == 'failure')
        working-directory: source
        shell: pwsh
        run: |
          Write-Error 'Regression or installation tests failed. Compilation is not functional acceptance. Read KNOWN-FAILURES.md, install-smoke.json and the diagnostic logs.'
          exit 1
